# 링크로 실행(정적 배포본) 자동 배포. main 에 push 하면: 테스트 → tools/build_web.py 로 web/ 를 만들고(금리표·고객 자료 없음, --check 로 재확인) → 배포.
# 배포 경로 두 가지:
#   (기본) 이 저장소의 GitHub Pages 로 직접 배포 — 공개 저장소(또는 유료 플랜의 비공개 저장소). Settings → Pages → Source "GitHub Actions"
#          (configure-pages 의 enablement 가 자동으로 켜 보지만, 안 되면 손으로 한 번 설정).
#   (변수 SITE_REPO 가 있으면) 별도의 공개 저장소로 web/ 만 push — 이 저장소를 비공개로 둘 때. secret SITE_REPO_TOKEN(fine-grained PAT, 그 저장소 Contents R/W) 필요.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      direct_pages: ${{ steps.mode.outputs.direct_pages }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python cb_valuation/step1_curve/graph/graph_check.py
      - run: python -m unittest discover -s cb_valuation/step1_curve/tests -t .
      - run: python tools/build_web.py --out web
      - name: Check the bundle carries no rate tables or client files
        run: python tools/build_web.py --check web
      - id: mode
        # 공개 저장소(또는 USE_GITHUB_PAGES=true)면 이 저장소의 Pages 로 직접; 비공개 저장소이고 SITE_REPO 가 있으면 배포용 공개 저장소로 push
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
          SITE_REPO: ${{ vars.SITE_REPO }}
          USE_PAGES: ${{ vars.USE_GITHUB_PAGES }}
        run: |
          if [ "$IS_PRIVATE" != "true" ] || [ "$USE_PAGES" = "true" ]; then echo "direct_pages=true" >> "$GITHUB_OUTPUT"; echo "mode: direct GitHub Pages (private=$IS_PRIVATE)";
          elif [ -n "$SITE_REPO" ]; then echo "direct_pages=false" >> "$GITHUB_OUTPUT"; echo "mode: publish to $SITE_REPO";
          else echo "direct_pages=false" >> "$GITHUB_OUTPUT"; echo "::notice::private repository without SITE_REPO — web/ built but not published (set variable SITE_REPO + secret SITE_REPO_TOKEN, or USE_GITHUB_PAGES=true on a paid plan)"; fi
      - name: Publish web/ to the public site repository (variable SITE_REPO + secret SITE_REPO_TOKEN)
        if: ${{ steps.mode.outputs.direct_pages == 'false' && vars.SITE_REPO != '' }}
        env:
          SITE_REPO: ${{ vars.SITE_REPO }}
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          set -e
          if [ -z "$SITE_REPO_TOKEN" ]; then echo "::error::secret SITE_REPO_TOKEN is missing (Settings → Secrets and variables → Actions)"; exit 1; fi
          git clone --depth 1 "https://x-access-token:${SITE_REPO_TOKEN}@github.com/${SITE_REPO}.git" site
          cd site
          git checkout -B main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../web/. .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "site unchanged"; exit 0; fi
          git commit -q -m "site: ${GITHUB_SHA::12}"
          git push origin main
          echo "published → https://$(echo "$SITE_REPO" | cut -d/ -f1).github.io/$(echo "$SITE_REPO" | cut -d/ -f2)/"
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.mode.outputs.direct_pages == 'true' }}
        with:
          path: web
  deploy:
    # 이 저장소의 GitHub Pages 로 직접 배포(공개 저장소의 기본 경로)
    if: ${{ needs.build.outputs.direct_pages == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        # Pages 자동 활성화 시도: 워크플로 토큰에 권한이 없으면 실패하므로 계속 진행(그때는 Settings → Pages → Source "GitHub Actions" 를 손으로 한 번)
        continue-on-error: true
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
