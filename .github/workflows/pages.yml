# GitHub Pages 배포: main 에 push 하면 테스트 → tools/build_web.py 로 web/ 를 만들어 Pages 에 올린다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 두면 된다(비공개 저장소의 Pages 는 유료 플랜 필요 — README '링크로 실행' 참조).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python cb_valuation/step1_curve/graph/graph_check.py
      - run: python -m unittest discover -s cb_valuation/step1_curve/tests -t .
      - run: python tools/build_web.py --out web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
